name: Publish KerimAnka UI 0.35.0
on:
  push:
    branches: [main]
    paths: [release/publish-0.35.0.json]
permissions:
  contents: write
concurrency:
  group: release-0.35.0
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Materialize and validate reviewed source changes
        run: python3 tools/materialize_release0350.py
      - name: Build complete suite from reviewed files
        run: python3 tools/package_release.py dist
      - name: Commit complete Classic Era source update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 tools/materialize_release0350.py --stage
          git commit -m 'Add Classic Era support and ready layouts in 0.35.0'
          git push origin HEAD:main
          echo "RELEASE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Publish complete suite
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view v0.35.0 >/dev/null 2>&1; then
            echo 'Release v0.35.0 already exists; refusing to replace it.'
            exit 1
          fi
          gh release create v0.35.0 --target "$RELEASE_COMMIT" --draft --title 'KerimAnka UI 0.35.0 - Classic Era support' --notes-file release/0.35.0-notes.md
          gh release upload v0.35.0 dist/KerimAnkaUI-0.35.0-complete-suite.zip dist/KerimAnkaUI-0.35.0-SHA256SUMS.txt
          gh release edit v0.35.0 --draft=false --latest
