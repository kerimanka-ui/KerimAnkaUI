name: Release reviewed KerimAnka products
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing reviewed release tag, for example v0.35.1'
        required: true
        type: string
  push:
    tags: ['v[0-9]*']
permissions:
  contents: read
concurrency:
  group: kerimanka-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Test separate product boundaries
        run: python3 -m unittest discover -s tests -p test_product_boundaries.py -v
      - name: Build only the reviewed products for this release
        run: python3 tools/build_reviewed_release.py --tag "$RELEASE_TAG" --output dist
      - name: Verify reviewed archive hashes
        run: python3 tools/check_product_release.py --tag "$RELEASE_TAG" --output dist
      - name: Publish distinct GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 tools/publish_product_release.py --tag "$RELEASE_TAG" --output dist
